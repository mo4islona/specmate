name: specmate

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-specmate}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images declare the volume one level up from PGDATA.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-specmate} -d ${POSTGRES_DB:-specmate}']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies drizzle migrations, then exits. Everything else waits on it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    command: ['bun', 'packages/db/src/migrate.ts']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-specmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-specmate}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-specmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-specmate}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/var/lib/specmate/workspaces}
      SPECMATE_PASSWORD: ${SPECMATE_PASSWORD}
    volumes:
      - ${WORKSPACE_ROOT:-/var/lib/specmate/workspaces}:${WORKSPACE_ROOT:-/var/lib/specmate/workspaces}
    expose:
      - '4000'
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ORCHESTRATOR_PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-specmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-specmate}
      # One absolute path, used on both sides of the mount below. A stage's
      # worktree is mounted into the runner by the path the orchestrator names,
      # and the runtime resolves that path on the host — so host and container
      # have to agree on what it means.
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/var/lib/specmate/workspaces}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-SpecMate}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-specmate@localhost}
      # Public OAuth app identifier. Authorization tokens remain in Postgres.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-docker}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-specmate/runner-universal:local}
      RUNNER_MODEL: ${RUNNER_MODEL:-claude-opus-5}
      RUNNER_AUTH_VOLUME: ${RUNNER_AUTH_VOLUME:-specmate_claude-auth}
      RUNNER_TOOLCHAINS_VOLUME: ${RUNNER_TOOLCHAINS_VOLUME:-specmate_toolchains}
      RUNNER_CPUS: ${RUNNER_CPUS:-2}
      RUNNER_MEMORY: ${RUNNER_MEMORY:-4g}
      STAGE_TIMEOUT_MS: ${STAGE_TIMEOUT_MS:-1800000}
      RUNNER_FORWARD_ENV: ${RUNNER_FORWARD_ENV:-}
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-5000}
      STAGE_CONCURRENCY: ${STAGE_CONCURRENCY:-1}
      STAGE_ATTEMPT_CAP: ${STAGE_ATTEMPT_CAP:-2}
    volumes:
      - ${WORKSPACE_ROOT:-/var/lib/specmate/workspaces}:${WORKSPACE_ROOT:-/var/lib/specmate/workspaces}
      # Effectively root on the host. Accepted for a single-owner deployment on
      # a private network; it is what isolates a stage from this process.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:${ORCHESTRATOR_PORT:-4100}:4100'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      API_UPSTREAM: api:4000
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    depends_on:
      - api

  # Built by `docker compose build`, never started by `up`: the orchestrator
  # starts one container per stage and discards it. The service exists so the
  # image has a build definition and so the one-time interactive login has
  # something to run: `docker compose run --rm runner claude`.
  runner:
    profiles: ['tools']
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        # Empty fails the build with a message from the Dockerfile; a `:?` here
        # would instead break every compose command, including `up postgres`.
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
        MISE_VERSION: ${MISE_VERSION:-}
    image: ${RUNNER_IMAGE:-specmate/runner-universal:local}
    volumes:
      - claude-auth:/home/agent
      - specmate_toolchains:/mise/shared:ro

volumes:
  pgdata:
  claude-auth:
  specmate_toolchains:
    name: ${RUNNER_TOOLCHAINS_VOLUME:-specmate_toolchains}
