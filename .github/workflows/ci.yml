name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.9

jobs:
  static:
    name: lint · types · specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bun run check
      - name: TypeScript
        run: bun run typecheck
      - name: OpenSpec validate
        run: bunx openspec validate --all --strict

  test:
    name: tests · migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: specmate
          POSTGRES_PASSWORD: specmate
          POSTGRES_DB: specmate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U specmate -d specmate_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://specmate:specmate@localhost:5432/specmate_test
      # Each of the ~14 test files that touch the database opens its own
      # pool; at the default max (10) that overruns this service container's
      # default max_connections (100) once enough files' pools stay open at
      # once. 3 leaves room for the tests that need genuine concurrency
      # (e.g. store.test.ts's "two concurrent raisers") while staying well
      # under the ceiling.
      DATABASE_POOL_MAX: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
      - name: Migrations are up to date with the schema
        run: |
          bun run db:generate
          git diff --exit-code -- packages/db/drizzle \
            || { echo "::error::schema changed without a generated migration — run 'bun run db:generate'"; exit 1; }
      - name: Unit tests
        # Two runners: `bun test` for everything headless, vitest for apps/web,
        # whose components are tested against a DOM. `bun run test` runs both.
        run: bun run test

  build:
    name: docker images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  runner:
    name: runner image · toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: false
          load: true
          tags: specmate/runner-universal:ci
          build-args: |
            CLAUDE_CODE_VERSION=2.1.212
            MISE_VERSION=2026.7.13
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - name: Pinned toolchain end to end
        env:
          RUNNER_IMAGE: specmate/runner-universal:ci
          SPECMATE_RUN_DOCKER_TESTS: '1'
        run: bun test packages/runner/test/toolchains.e2e.test.ts
