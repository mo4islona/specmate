# Capability -> REQ/AC ID band (blocks of 100; REQ and AC share the band start
# and count independently, sequential in document order).
# Bands are never renumbered or reused; gaps stay reserved. New capabilities
# claim the next free block. `bun scripts/lint-spec-ids.ts --next` prints the
# next free number per capability and the next free band.
#
# A capability that fills its block claims a second one rather than renumbering
# anything: an ID is immutable, so growth has to be additive. Allocation then
# comes from the newest block only — the earlier one is closed, not backfilled,
# so a single change's IDs never straddle two blocks.
bandSize: 100
bands:
  agent-contracts: 100
  agent-execution: 200
  persistence: 300
  pipeline-definitions: 400
  service-topology: 500
  task-lifecycle: 600
  workspace-lifecycle: 700
  execution-environment: 800
  # Two numbers left in 900 when the Files surface needed more than two.
  operator-ui: [900, 1800]
  # Split out of operator-ui, which keeps 900. The launch screen's existing IDs
  # stay in that block — an ID may not move — and everything new comes from 1900.
  launch-screen: [900, 1900]
  task-surface: 1000
  verification: 1100
  decisions: 1200
  kickoff-brief: 1300
  harness-coverage: 1400
  budgets: 1500
  task-qa: 1600
  spec-conventions: 1700
